<style>

body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f2f2f7;
    margin:0;
    padding:16px;
}

h1{
    font-size:24px;
}

.card{
    background:white;
    padding:14px;
    border-radius:18px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input,textarea{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    border-radius:12px;
    border:1px solid #ddd;
    margin-top:8px;

    min-height:80px;

}

button{
    border:none;
    border-radius:12px;
    padding:12px 14px;

    margin-top:8px;
    cursor:pointer;
}

.primary{
    background:#007aff;
    color:white;
}

.success{
    background:#34c759;
    color:white;
}

.danger{
    background:#ff3b30;
    color:white;
}

.warn{
    background:#ffcc00;
    color:#1c1c1e;
}

.warn2{
    background:#d70015;
    color:white;
}

.zalo{
    background:#0068ff;
    color:white;
}

.zalo2{
    background:#3d8bff;
    color:white;
}

.zalo3{
    background:#0047b3;
    color:white;
}

.row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.phone-card{
    background:white;
    padding:14px;
    border-radius:18px;
    margin-bottom:12px;

}

.phone-number{
    font-size:22px;
    font-weight:bold;
}

.status{
    margin-top:8px;
    margin-right:6px;
    padding:6px 10px;
    border-radius:999px;
    display:inline-block;
    font-size:13px;
    cursor:pointer;
}

.called{
    background:#d1f7dd;
    color:#147a36;
}

.not-called{
    background:#ffe4e1;
    color:#c0392b;
}

.sms-sent{
    background:#d1e8ff;

}

.sms-not-sent{
    background:#fff4d1;

}

.info-box{
    margin-top:8px;
    background:#fafafa;
    border:1px solid #ddd;
    padding:10px;
    border-radius:12px;
}

.amount{
    font-weight:bold;
    color:#c0392b;
    font-size:18px;
}

.history-box{
    margin-top:8px;
    background:#f0f7ff;
    border:1px solid #cfe2ff;
    padding:8px 10px;
    border-radius:10px;
    font-size:13px;
    color:#0a4a8f;
    white-space:pre-wrap;
}

</style>

<body>

<h1>⚡ Khách Hàng Điện</h1>

<div class="card">

<input type="file" id="excelFile" accept=".xlsx,.xls" onchange="importExcel(event)">

<input type="text" id="searchInput" placeholder="🔍 Tìm SĐT, mã KH, tên, địa chỉ..." oninput="renderList()">

<div class="row">
<button class="danger" onclick="clearAll()">
🗑 Xóa tất cả
</button>
</div>

<div id="counter"><div style="margin-top:10px;font-size:14px">
    Tổng: <b>0</b>
    | Đã gọi: <b>0</b>
    | Đã nhắn: <b>0</b>
    </div></div>

</div>

<div id="phoneList"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnO-uCUtDk6ALBjRUDS7R0JwYUqr_B26c",
  authDomain: "tung086-e41e3.firebaseapp.com",
  databaseURL: "https://tung086-e41e3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tung086-e41e3",
  storageBucket: "tung086-e41e3.firebasestorage.app",
  messagingSenderId: "566074207671",
  appId: "1:566074207671:web:3eb91b1ded506e2494cc32",
  measurementId: "G-K8T53ZBX84"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.set = set;
window.push = push;
window.onValue = onValue;

console.log("Firebase Connected");

</script>

<script>

let phoneData =
JSON.parse(localStorage.getItem('phoneData') || '[]');

function fbKey(item){
    return (item.customerCode || item.phone)
        .replace(/[.#$\[\]\/]/g,'_');
}

function saveCustomer(index){

    if(!window.db) return;

    const item = phoneData[index];
    const key = fbKey(item);

    set(
        ref(db,'customers/'+key+'/data'),
        {
            phone: item.phone||'',
            customerCode: item.customerCode||'',
            maTram: item.maTram||'',
            customerName: item.customerName||'',
            address: item.address||'',
            amount: String(item.amount||'0'),
            note: item.note||'',
            called: item.called||false,
            time: item.time||null,
            smsSent: item.smsSent||false,
            smsTime: item.smsTime||null
        }
    );

}

function saveData(){

    localStorage.setItem(
        'phoneData',
        JSON.stringify(phoneData)
    );

    phoneData.forEach((_,i) => saveCustomer(i));

}

function pushLog(item, text){

    if(!window.db) return;

    push(
        ref(db,'customers/'+fbKey(item)+'/logs'),
        {
            detail: text,
            time: new Date().toLocaleString('vi-VN'),
            ts: Date.now()
        }
    );

}

function normalizePhone(phone){
    return phone.replace(/[^0-9]/g,'');
}

function formatAmount(value){

    if(value===null||value===undefined||value==='')
        return '0';

    const num =
    Number(String(value).replace(/[^0-9.-]/g,''));

    if(isNaN(num)) return String(value);

    return num.toLocaleString('vi-VN');

}

function appendHistory(index, text){

    const time = new Date().toLocaleString('vi-VN');
    const line = `[${time}] ${text}`;
    const item = phoneData[index];

    if(!item.history) item.history = '';
    item.history = item.history
        ? item.history + '\n' + line
        : line;

    pushLog(item, text);

}

function buildHistoryFromLogs(logs){

    if(!logs) return '';

    return Object.values(logs)
        .filter(l => l && l.time)
        .sort((a,b) => (a.ts||0) - (b.ts||0))
        .map(l => `[${l.time}] ${l.detail||''}`)
        .join('\n');

}

function importExcel(event){

    const file = event.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data,{type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        let added = 0;

        json.forEach(row=>{

            const customerCode =
            row.MA_KHTT || row.MA_KH || row.MAKH || '';

            const maTram =
            row.MA_TRAM || row.MATRAM || '';

            const customerName =
            row.TEN_KHTT || row.TEN_KH || '';

            const address =
            row.DCHI_KHTT || row.DCHI_KH || '';

            const amount =
            row.SO_TIEN || row.SOTIEN || row.CONGNO || '0';

            const phoneRaw =
            row.SO_DIENTHOAI || row.SDT || row.DIENTHOAI || '';

            if(!phoneRaw) return;

            const normalized =
            normalizePhone(String(phoneRaw));

            if(!phoneData.find(p=>p.phone===normalized)){

                phoneData.push({
                    phone: normalized,
                    customerCode,
                    maTram,
                    customerName,
                    address,
                    amount,
                    note: '',
                    history: '',
                    called: false,
                    time: null,
                    smsSent: false,
                    smsTime: null
                });

                added++;

            }

        });

        saveData();
        renderList();
        alert('Đã import '+added+' khách hàng');

    };

    reader.readAsArrayBuffer(file);

}

function callNumber(phone,index){

    const item = phoneData[index];
    item.called = true;
    item.time = new Date().toLocaleString('vi-VN');

    appendHistory(index,'📲 Đã bấm GỌI');

    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

    window.location.href = 'tel:'+phone;

}

const REMINDER1_TEXT =
'THỜI GIAN NỘP TIỀN ĐIỆN TỪ NGÀY MÙNG 3 ĐẦU THÁNG ĐẾN NGÀY MÙNG 10 HÀNG THÁNG. SAU NGÀY 10, BÊN ĐIỆN LỰC SẼ TIẾN HÀNH CẮT ĐIỆN. NẾU CÓ SAI SỐ ĐIỆN THOẠI HOẶC QUÝ KHÁCH ĐÃ NỘP TIỀN RỒI, XIN QUÝ KHÁCH VUI LÒNG BỎ QUA THÔNG BÁO NÀY. EM XIN CẢM ƠN NHIỀU Ạ.';

const REMINDER2_TEXT =
'THỜI GIAN 9H SÁNG MAI BÊN EM PHẢI ĐI CẮT ĐIỆN RỒI Ạ. NẾU QUÝ KHÁCH ĐÃ NỘP TIỀN RỒI HOẶC SAI SỐ ĐIỆN THOẠI, XIN QUÝ KHÁCH VUI LÒNG BỎ QUA Ạ. EM XIN CẢM ƠN NHIỀU.';

function buildMessage(name,code,amount,extra){

    let msgText =
        'Kính gửi '+(name||'')+
        ' - '+(code||'')+
        ', vui lòng thanh toán tiền điện. Số tiền: '+formatAmount(amount);

    if(extra){
        msgText += '. ' + extra;
    }

    return msgText;

}

function copyText(text){

    // iOS refuses to select a readonly textarea, so keep it editable and
    // select through a Range. execCommand stays inside the user gesture.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.contentEditable = 'true';
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);

    const range = document.createRange();
    range.selectNodeContents(ta);

    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, text.length);

    try{ document.execCommand('copy'); }catch(e){}

    document.body.removeChild(ta);

    // Async and best-effort: it consumes the tap's user activation on iOS,
    // so nothing that needs activation may run after this.
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).catch(()=>{});
    }

}

function sendSMS(phone,name,code,amount,index,extra,label){

    const item = phoneData[index];

    const msgText = buildMessage(name,code,amount,extra);

    const msg = encodeURIComponent(msgText);

    item.smsSent = true;
    item.smsTime = new Date().toLocaleString('vi-VN');

    appendHistory(index,(label||'💬 Đã bấm SMS')+' - '+formatAmount(amount)+'đ');

    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

    // Android uses '?body=', iOS uses '&body='
    const isAndroid = /android/i.test(navigator.userAgent);
    const sep = isAndroid ? '?' : '&';
    window.location.href = `sms:${phone}${sep}body=${msg}`;

}

function markZaloSent(index, amount, label){

    const item = phoneData[index];

    item.smsSent = true;
    item.smsTime = new Date().toLocaleString('vi-VN');

    appendHistory(index,(label||'🟦 Đã bấm ZALO')+' - '+formatAmount(amount)+'đ');

    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

}

// Zalo has no deep link carrying both a number and a message body, and the
// share-sheet route cannot target a number at all. So: copy the text, then
// open that customer's chat by number and let the user paste.
function sendZalo(phone,name,code,amount,index,extra,label){

    const msgText = buildMessage(name,code,amount,extra);

    copyText(msgText);

    markZaloSent(index, amount, label);

    alert('Đã copy nội dung tin nhắn.\nMở Zalo rồi dán (paste) vào khung chat.');

    window.location.href = 'https://zalo.me/'+encodeURIComponent(phone);

}

function sendZaloReminder1(index){

    const it = phoneData[index];

    sendZalo(
        it.phone, it.customerName, it.customerCode, it.amount, index,
        REMINDER1_TEXT,
        '🟦 Zalo nhắc 1'
    );

}

function sendZaloReminder2(index){

    const it = phoneData[index];

    sendZalo(
        it.phone, it.customerName, it.customerCode, it.amount, index,
        REMINDER2_TEXT,
        '🟦 Zalo nhắc 2'
    );

}

function sendReminder1(index){

    const it = phoneData[index];

    sendSMS(
        it.phone, it.customerName, it.customerCode, it.amount, index,
        REMINDER1_TEXT,
        '🔔 Tin nhắc 1'
    );

}

function sendReminder2(index){

    const it = phoneData[index];

    sendSMS(
        it.phone, it.customerName, it.customerCode, it.amount, index,
        REMINDER2_TEXT,
        '🔔 Tin nhắc 2'
    );

}

function updateNote(index,value){

    phoneData[index].note = value;
    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));

}

function toggleCalled(index){

    const item = phoneData[index];
    item.called = !item.called;
    item.time = new Date().toLocaleString('vi-VN');

    appendHistory(index,
        item.called
        ? '✓ Đánh dấu ĐÃ GỌI (thủ công)'
        : '✗ Bỏ đánh dấu đã gọi'
    );

    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

}

function toggleSms(index){

    const item = phoneData[index];
    item.smsSent = !item.smsSent;
    item.smsTime = new Date().toLocaleString('vi-VN');

    appendHistory(index,
        item.smsSent
        ? '✓ Đánh dấu ĐÃ NHẮN (thủ công)'
        : '✗ Bỏ đánh dấu đã nhắn'
    );

    saveCustomer(index);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

}

function deletePhone(index){

    const item = phoneData[index];
    const key = fbKey(item);

    if(window.db){
        set(ref(db,'customers/'+key+'/data'), null);
    }

    phoneData.splice(index,1);
    localStorage.setItem('phoneData',JSON.stringify(phoneData));
    renderList();

}

function clearAll(){

    if(confirm('Xóa toàn bộ dữ liệu?')){

        if(window.db){
            phoneData.forEach(item=>{
                set(ref(db,'customers/'+fbKey(item)+'/data'), null);
            });
        }

        phoneData = [];
        localStorage.setItem('phoneData',JSON.stringify(phoneData));
        renderList();

    }

}

function escapeAttr(str){
    return String(str||'')
        .replace(/\\/g,'\\\\')
        .replace(/'/g,"\\'")
        .replace(/"/g,'&quot;');
}

function escapeHtml(str){
    return String(str||'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;');
}

function renderList(){

    const list = document.getElementById('phoneList');

    const search =
    document.getElementById('searchInput')
    .value.trim();

    list.innerHTML = '';

    const q = search.toLowerCase();

    const filtered =
    phoneData.filter(item=>
        !q ||
        item.phone.includes(q) ||
        (item.customerCode||'').toLowerCase().includes(q) ||
        (item.customerName||'').toLowerCase().includes(q) ||
        (item.address||'').toLowerCase().includes(q)
    );

    filtered.forEach(item=>{

        const realIndex = phoneData.indexOf(item);
        const div = document.createElement('div');
        div.className='phone-card';

        div.innerHTML = `

        <div class="phone-number">
        ${item.phone}
        </div>

        <div class="info-box">
        🆔 <b>${escapeHtml(item.customerCode)}${item.maTram ? ' - ' + escapeHtml(item.maTram) : ''}</b>
        </div>

        <div class="info-box">
        👤 <b>${escapeHtml(item.customerName)}</b>
        </div>

        <div class="info-box">
        📍 ${escapeHtml(item.address)}
        </div>

        <div class="info-box">
        💰 <span class="amount">${formatAmount(item.amount)}</span> đ
        </div>

        <div>

        <span class="
        status
        ${item.called ? 'called':'not-called'}
        " onclick="toggleCalled(${realIndex})">
        ${item.called ? '✓ Đã gọi':'✗ Chưa gọi'}
        </span>

        <span class="
        status
        ${item.smsSent ? 'sms-sent':'sms-not-sent'}
        " onclick="toggleSms(${realIndex})">
        ${item.smsSent ? '✓ Đã nhắn':'✗ Chưa nhắn'}
        </span>

        </div>

        ${
            item.history
            ?
            `<div class="history-box">📜 Nhật ký:\n${escapeHtml(item.history)}</div>`
            :
            ''
        }

        <textarea
        placeholder="📝 Ghi chú riêng"
        onchange="updateNote(${realIndex},this.value)"
        >${escapeHtml(item.note)}</textarea>

        <div class="row">

        <button class="primary"
        onclick="callNumber('${item.phone}',${realIndex})">
        📲 Gọi
        </button>

        <button class="success"
        onclick="sendSMS('${item.phone}','${escapeAttr(item.customerName)}','${escapeAttr(item.customerCode)}','${escapeAttr(item.amount)}',${realIndex})">
        💬 SMS
        </button>

        <button class="warn"
        onclick="sendReminder1(${realIndex})">
        🔔 Tin nhắc 1
        </button>

        <button class="warn2"
        onclick="sendReminder2(${realIndex})">
        🔔 Tin nhắc 2
        </button>

        <button class="danger"
        onclick="deletePhone(${realIndex})">
        🗑 Xóa
        </button>

        </div>

        <div class="row">

        <button class="zalo"
        onclick="sendZalo('${item.phone}','${escapeAttr(item.customerName)}','${escapeAttr(item.customerCode)}','${escapeAttr(item.amount)}',${realIndex})">
        🟦 Zalo
        </button>

        <button class="zalo2"
        onclick="sendZaloReminder1(${realIndex})">
        🟦 Zalo nhắc 1
        </button>

        <button class="zalo3"
        onclick="sendZaloReminder2(${realIndex})">
        🟦 Zalo nhắc 2
        </button>

        </div>

        `;

        list.appendChild(div);

    });

    const called = phoneData.filter(p=>p.called).length;
    const smsSent = phoneData.filter(p=>p.smsSent).length;

    document.getElementById('counter').innerHTML =
    `<div style="margin-top:10px;font-size:14px">
    Tổng: <b>${phoneData.length}</b>
    | Đã gọi: <b>${called}</b>
    | Đã nhắn: <b>${smsSent}</b>
    </div>`;

}

if(window.db){

    onValue(
        ref(db,'customers'),
        (snapshot)=>{

            const raw = snapshot.val();
            if(!raw) return;

            const entries = Object.entries(raw);
            if(entries.length === 0) return;

            const firstKey = entries[0][0];
            const firstVal = entries[0][1];

            const isOldFormat =
                !isNaN(firstKey) &&
                firstVal &&
                firstVal.phone !== undefined &&
                firstVal.data === undefined;

            if(isOldFormat){

                phoneData = Object.values(raw)
                    .filter(v => v && v.phone);

                const newStructure = {};
                phoneData.forEach(item=>{
                    const key = fbKey(item);
                    newStructure[key] = {
                        data: {
                            phone: item.phone||'',
                            customerCode: item.customerCode||'',
                            maTram: item.maTram||'',
                            customerName: item.customerName||'',
                            address: item.address||'',
                            amount: String(item.amount||'0'),
                            note: item.note||'',
                            called: item.called||false,
                            time: item.time||null,
                            smsSent: item.smsSent||false,
                            smsTime: item.smsTime||null
                        }
                    };
                    if(item.history){
                        newStructure[key].logs = {
                            migrated: {
                                detail: item.history,
                                time: new Date().toLocaleString('vi-VN'),
                                ts: 0
                            }
                        };
                    }
                });

                set(ref(db,'customers'), newStructure);

                localStorage.setItem('phoneData',JSON.stringify(phoneData));
                renderList();
                return;

            }

            phoneData = entries
                .filter(([,val]) => val && val.data)
                .map(([,val])=>{
                    const d = val.data;
                    return {
                        phone: d.phone||'',
                        customerCode: d.customerCode||'',
                        maTram: d.maTram||'',
                        customerName: d.customerName||'',
                        address: d.address||'',
                        amount: d.amount||'0',
                        note: d.note||'',
                        called: d.called||false,
                        time: d.time||null,
                        smsSent: d.smsSent||false,
                        smsTime: d.smsTime||null,
                        history: buildHistoryFromLogs(val.logs)
                    };
                });

            localStorage.setItem('phoneData',JSON.stringify(phoneData));
            renderList();

        }
    );

}

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
}

renderList();

</script>



</body></html>
